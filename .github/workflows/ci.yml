name: CI

on:
  push:
    branches: [main]
  pull_request:

# Never use `paths-ignore` on a required check — PRs that touch only ignored paths
# deadlock forever at "Expected — Waiting for status". Skip work inside the jobs instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The `canvas` vitest project launches real Chromium. playwright@1.62.1 ships
      # no npm install script, so `npm ci` downloads no browsers and the project
      # cannot launch. Installed here rather than narrowing CI to
      # `--project=node --project=dom`: a test project that never runs in CI reads
      # as coverage while proving nothing — the exact failure #75 fixed.
      - name: Install Chromium for canvas tests
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: bundle budgets
        run: |
          if [ -f .size-limit.json ]; then npm run size; else echo "no .size-limit.json yet - skipping"; fi

      - name: first-load budget
        run: |
          if [ -f scripts/ci/check-first-load.mjs ]; then node scripts/ci/check-first-load.mjs; else echo "no first-load checker yet - skipping"; fi

  # Single aggregator so branch protection has exactly one stable required check to
  # name, regardless of how the matrix above evolves. `if: always()` so it still
  # reports when an upstream job is skipped or cancelled.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Assert no upstream failure
        run: |
          echo "verify=${{ needs.verify.result }}"
          case "${{ needs.verify.result }}" in
            success|skipped) echo "ci-ok" ;;
            *) echo "upstream job failed or was cancelled" >&2; exit 1 ;;
          esac
