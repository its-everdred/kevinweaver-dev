name: Verify CONTRIB_TOKEN

# One-shot privacy assertion for the contribution-counting credential.
# Proves, from the environment that will actually use it, that CONTRIB_TOKEN
# (a) can read contribution counts and (b) cannot read any repository content.
# See docs/build-orders/site-rewrite/private-contribution-privacy.md
#
# Prints only aggregate counts and the scope header. Never echoes the token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T: ${{ secrets.CONTRIB_TOKEN }}
    steps:
      - name: Scope must be exactly read:user
        run: |
          if [ -z "$T" ]; then
            echo "::error::CONTRIB_TOKEN is empty or not set"
            exit 1
          fi
          SCOPES=$(curl -sI -H "Authorization: token $T" https://api.github.com/user \
                   | tr -d '\r' | grep -i '^x-oauth-scopes:' | sed 's/^[^:]*: *//')
          echo "scopes: [$SCOPES]"
          if [ "$SCOPES" != "read:user" ]; then
            echo "::error::expected exactly 'read:user', got '$SCOPES'"
            exit 1
          fi
          echo "OK: scope is exactly read:user"

      - name: Can read contribution counts
        run: |
          Q='{"query":"{viewer{login contributionsCollection(from:\"2026-01-01T00:00:00Z\",to:\"2026-07-31T00:00:00Z\"){restrictedContributionsCount totalCommitContributions}}}"}'
          curl -s -H "Authorization: bearer $T" -d "$Q" https://api.github.com/graphql > resp.json
          if jq -e '.errors' resp.json >/dev/null 2>&1; then
            echo "::error::GraphQL errors: $(jq -c '.errors' resp.json | head -c 300)"
            exit 1
          fi
          R=$(jq -r '.data.viewer.contributionsCollection.restrictedContributionsCount' resp.json)
          C=$(jq -r '.data.viewer.contributionsCollection.totalCommitContributions' resp.json)
          L=$(jq -r '.data.viewer.login' resp.json)
          echo "login                       : $L"
          echo "restrictedContributionsCount: $R"
          echo "totalCommitContributions    : $C"
          echo ""
          echo "Blinded baseline (no SSO) was 488 for this window."
          if [ "$R" -gt 600 ]; then
            echo "SSO AUTHORIZED: private volume is now visible."
          else
            echo "::warning::restricted count ($R) is not materially above the blinded baseline (488) — SSO authorization may not have applied to ethereum-optimism."
          fi

      - name: Cannot read private repository content
        run: |
          fail=0
          check () {
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $T" "$2")
            case "$code" in
              401|403|404) echo "BLOCKED ($code): $1" ;;
              *)           echo "::error::LEAK ($code): $1"; fail=1 ;;
            esac
          }
          check "list private repos"    "https://api.github.com/user/repos?visibility=private&per_page=1"
          check "read OP Labs content"  "https://api.github.com/repos/ethereum-optimism/optimism/contents/README.md"
          check "list org private repos" "https://api.github.com/orgs/ethereum-optimism/repos?type=private&per_page=1"
          exit $fail

      - name: Result
        run: echo "CONTRIB_TOKEN verified - counts readable, content unreachable."
